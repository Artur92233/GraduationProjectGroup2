{% extends "components/main_page.html" %}

{% block content %}
 <h2>Продати квартиру</h2>
<div class="container">
  <form action="{{ url_for('sell_buildings') }}" method="post" enctype="multipart/form-data">

    <input type="text" name="title" value="{{ building.title }}" placeholder="Назва" class="title" required>
    <br>
    <input type="text" name="description" value="{{ building.description }}" placeholder="Опис" class="description" required>
    <br>
    <input type="number" name="apartment_price" value="{{ building.apartment_price }}" placeholder="Ціна" class="price" required>
    <br>
    <input type="text" name="address" value="{{ building.address }}" placeholder="Адреса" class="address" required>
    <br>
    <input type="tel" name="contact" value="{{ building.contact }}" placeholder="Номер телефону" class="tel" required>
    <br>

    <label for="type">Виберіть місце публікації та варіант для продажу</label>
    <select class="type" id="type" name="building_type">
      <option value="{{ second_owner }}">Вторинний ринок</option>
      <option value="{{ rent }}">Оренда</option>
    </select>
    <br><br>

    <label for="main_image">Виберіть зображення на головну</label>
    <input type="file" name="main_image" id="main_image" required>

    <button type="button" class="add-images" id="add-images">+</button>
    <div id="image-container"></div>
    <br>

    <input type="submit" value="Підтвердити" class="submit-building">
   </form>
</div>
<script>
  const addImages = document.querySelector('#add-images');
  const imageContainer = document.querySelector('#image-container');

  addImages.addEventListener('click', function(event) {
    event.preventDefault();

    const input = document.createElement('input');
    input.type = 'file';
    input.className = 'images';
    input.value = '{{ building.images }}'

    imageContainer.appendChild(input);
  })
</script>
{% endblock %}
